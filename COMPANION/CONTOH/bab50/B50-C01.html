<!-- B50-C01: Komponen Interaktif Bootstrap 5 (Modal & Accordion) -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B50-C01: Komponen Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container" style="max-width: 600px;">
    <h1>Komponen Bootstrap 5</h1>
    
    <button type="button" class="btn btn-primary my-3" data-bs-toggle="modal" data-bs-target="#contohModal">
      Buka Dialog Modal
    </button>

    <div class="modal fade" id="contohModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Konfirmasi Submisi</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            Karya Anda telah tercatat di sistem kurasi.
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
