<!-- B57-C01: Open Graph Meta Tags & SEO untuk Desainer -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Studio Kriya Rarasati — Desain Visual & Web Inklusif</title>
  <meta name="description" content="Portofolio kurasi karya identitas merek, desain editorial majalah, dan situs web ramah aksesibilitas.">
  
  <!-- Open Graph Meta Tags untuk Kartu Media Sosial -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rarasati.design/">
  <meta property="og:title" content="Studio Kriya Rarasati — Desain Visual & Web">
  <meta property="og:description" content="Jelajahi portofolio kurasi karya identitas merek dan antarmuka digital yang inklusif.">
  <meta property="og:image" content="https://rarasati.design/og-preview.jpg">
</head>
<body>
  <h1>Studio Kriya Rarasati</h1>
  <p>Halaman ini telah dilengkapi metadata Open Graph lengkap untuk pratinjau media sosial yang memikat.</p>
</body>
</html>
