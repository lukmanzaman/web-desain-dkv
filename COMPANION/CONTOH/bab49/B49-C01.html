<!-- B49-C01: Galeri Kartu Responsif Bootstrap Grid (CDN) -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B49-C01: Bootstrap 5 Grid & Utilitas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4 text-center">Kurasi Karya Desain (Bootstrap Grid)</h1>
    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm border-0">
          <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=400" class="card-img-top" alt="Karya">
          <div class="card-body">
            <h5 class="card-title">Tipografi Vernakular</h5>
            <p class="card-text text-muted">Eksplorasi papan nama warung tradisional nusantara.</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm border-0">
          <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=400" class="card-img-top" alt="Karya">
          <div class="card-body">
            <h5 class="card-title">Seni Cetak Grafis</h5>
            <p class="card-text text-muted">Teknik cukil kayu di atas kertas buatan tangan.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
