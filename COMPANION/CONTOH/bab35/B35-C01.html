<!-- B35-C01: Kartu Berita dengan Gambar Responsif & Aspect-Ratio -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B35-C01: Gambar & Tipografi Responsif</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #f1f5f9; }
    .magazine-card {
      max-width: 540px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .media-frame {
      width: 100%;
      aspect-ratio: 16 / 9; /* Menjaga rasio bingkai tetap stabil sebelum gambar selesai dimuat */
      background: #e2e8f0;
    }
    .media-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-text { padding: 1.5rem; }
    .card-title {
      font-size: clamp(1.25rem, 1rem + 1vw, 1.75rem);
      margin: 0 0 0.5rem 0;
    }
  </style>
</head>
<body>
  <article class="magazine-card">
    <div class="media-frame">
      <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=600" alt="Pameran">
    </div>
    <div class="card-text">
      <h2 class="card-title">Kurasi Biennale Desain 2026</h2>
      <p>Rasio aspek 16:9 mencegah pergeseran tata letak kumulatif (CLS).</p>
    </div>
  </article>
</body>
</html>
