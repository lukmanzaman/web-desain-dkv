<!-- B47-C01: Template Styleguide Sistem Desain -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B47-C01: Panduan Gaya Sistem Desain (Styleguide)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #1e293b; }
    .sg-section { margin-bottom: 3rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 2rem; }
    .sg-title { color: #4f46e5; border-bottom: 2px solid #4f46e5; display: inline-block; padding-bottom: 0.25rem; }
    .sg-preview { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>📘 Dokumentasi Sistem Desain Antara</h1>
  
  <section class="sg-section">
    <h2 class="sg-title">Komponen Tombol (.c-btn)</h2>
    <div class="sg-preview">
      <button style="padding: 0.5rem 1rem; background: #4f46e5; color: #fff; border: none; border-radius: 6px;">Tombol Utama</button>
    </div>
  </section>
</body>
</html>
