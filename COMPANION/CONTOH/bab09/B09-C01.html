<!-- B09-C01: Tabel Paket Desain Semantik -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pustaka Antara — Biaya Layanan Desain</title>
</head>
<body>
  <table>
    <caption>Daftar Biaya Layanan Studio Desain Grafis 2026</caption>
    <thead>
      <tr>
        <th scope="col">Paket Layanan</th>
        <th scope="col">Durasi Pengerjaan</th>
        <th scope="col">Investasi (IDR)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Identitas Visual</th>
        <td>14 Hari Kerja</td>
        <td>12.500.000</td>
      </tr>
      <tr>
        <th scope="row">Desain Editorial (Buku)</th>
        <td>21 Hari Kerja</td>
        <td>18.000.000</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th scope="row">Total Estimasi Awal</th>
        <td colspan="2">Termasuk konsultasi & manual panduan</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
