<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><title>Kontak & Layanan — ISDN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="master-header"><div class="kontainer header-wrap"><div class="brand-instansi">ISDN SURABAYA</div><nav class="nav-instansi"><a href="index.html">Beranda</a><a href="kontak.html" class="active">Kontak</a></nav></div></header>
  <main class="kontainer main-content">
    <h1>Formulir Layanan Informasi Publik</h1>
    <!-- B66-C02: Formulir Pertanyaan Publik -->
    <form class="form-lembaga" action="#" method="POST">
      <p><label for="nama">Nama Lengkap:</label><br><input type="text" id="nama" name="nama" required class="input-teks"></p>
      <p><label for="pesan">Pertanyaan:</label><br><textarea id="pesan" name="pesan" rows="4" class="input-teks"></textarea></p>
      <button type="submit" class="btn-kirim">Kirimkan Formulir</button>
    </form>
  </main>
</body>
</html>
