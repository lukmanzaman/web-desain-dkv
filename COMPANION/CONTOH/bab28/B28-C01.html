<!-- B28-C01: Navigasi Sederhana dengan inline-block -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B28-C01: Aliran Normal & Properti Display</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      color: #1f2937;
    }
    .nav-list {
      list-style: none;
      padding: 0;
      margin: 0;
      background-color: #f3f4f6;
      border-radius: 8px;
    }
    .nav-item {
      display: inline-block; /* Mengubah elemen blok <li> agar berjejer menyamping */
    }
    .nav-link {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      text-decoration: none;
      color: #374151;
      font-weight: 500;
    }
    .nav-link:hover {
      background-color: #e5e7eb;
      color: #111827;
    }
  </style>
</head>
<body>
  <h1>Navigasi Tradisional dengan inline-block</h1>
  <ul class="nav-list">
    <li class="nav-item"><a href="#" class="nav-link">Beranda</a></li>
    <li class="nav-item"><a href="#" class="nav-link">Galeri Desain</a></li>
    <li class="nav-item"><a href="#" class="nav-link">Tentang Studio</a></li>
    <li class="nav-item"><a href="#" class="nav-link">Hubungi Kami</a></li>
  </ul>
</body>
</html>
