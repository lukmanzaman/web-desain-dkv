<!-- B39-C01: Titik Status Real-Time & Riak Gelombang Sonar Pulse -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B39-C01: Animasi Keyframes — Sonar Pulse</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 3rem; background: #0f172a; color: #fff; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1.25rem;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-radius: 50px;
    }
    .status-dot {
      position: relative;
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
    }
    /* Riak Gelombang Keyframes */
    .status-dot::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #22c55e;
      border-radius: 50%;
      animation: sonar-ripple 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    @keyframes sonar-ripple {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(3.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="status-pill">
    <span class="status-dot"></span>
    <span>Studio Terbuka untuk Kolaborasi</span>
  </div>
</body>
</html>
