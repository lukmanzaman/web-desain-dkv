<!-- B50-L01.html: Latihan Kustomisasi Komponen Bootstrap -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan B50-L01: Kustomisasi Modal Ekstra Besar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2>🛠️ Latihan B50-L01: Modal Ekstra Besar (.modal-xl)</h2>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#modalBesar">Lihat Spesimen Font</button>
    
    <div class="modal fade" id="modalBesar" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Spesimen Tipografi Nusantara</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center p-5">
            <h1 style="font-size: 4rem;">Aa Bb Cc Gg Jj</h1>
            <p class="text-muted">Aksara Kawi Modern &middot; Rasio Display 120pt</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
