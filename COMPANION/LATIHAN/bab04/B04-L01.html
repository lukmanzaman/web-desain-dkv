<!-- B04-L01: Berkas Latihan Mengoreksi Anatomi HTML
     Tantangan Studio:
     1. Ubah (M1): Tambahkan deklarasi <!DOCTYPE html> dan atribut lang="id" pada tag <html>.
     2. Koreksi (M5): Temukan tag penutup yang posisinya tumpang tindih (overlap) dan perbaiki menjadi simetris.
     3. Pindahkan (M4): Pindahkan teks judul yang salah tersasar di dalam <head> ke bagian teratas <body>.
-->
<html>
  <head>
    <meta charset="UTF-8">
    <title>Pustaka Antara &middot; Jurnal Tipografi</title>
    <!-- KESALAHAN 1: Tag visual berikut tersasar di dalam <head> -->
    <h1>Pustaka Antara</h1>
  </head>
  <body>
    <!-- KESALAHAN 2: Tag penutup asimetris / tumpang tindih -->
    <p>Buku ini ditulis untuk <strong><em>mahasiswa desain</strong></em> Indonesia.</p>
    
    <!-- KESALAHAN 3: Penyarangan terbalik -->
    <p>Menjelajahi keindahan <b><i>aksara Nusantara</b></i> di layar peramban.</p>
  </body>
</html>
