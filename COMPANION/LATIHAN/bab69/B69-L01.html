<!-- B69-L01.html: Latihan Bedah Redaksional Antarmuka (Microcopy) -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan B69-L01: Microcopy Ramah Pengguna</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    .microcopy-box { background: #fef2f2; border-left: 4px solid #ef4444; padding: 1rem; margin-bottom: 1.5rem; border-radius: 0 8px 8px 0; }
    .microcopy-box.solutif { background: #f0fdf4; border-left-color: #22c55e; }
  </style>
</head>
<body>
  <h1>✍️ Latihan Studio: Bedah Redaksional Antarmuka (B69-L01)</h1>

  <div class="microcopy-box">
    <strong>❌ Kalimat Kaku Lama:</strong>
    <p>"Input file gagal karena melebihi kuota 5MB!"</p>
  </div>

  <div class="microcopy-box solutif">
    <strong>✅ Redaksi Ramah & Solutif:</strong>
    <p>"Ukuran berkas Anda melebihi batas 5MB. Silakan unggah format WebP atau gunakan kompresi gambar sebelum mencoba kembali."</p>
  </div>
</body>
</html>
