<!-- B32-L01-katalog-produk.html: Auto-Fit & Minmax Grid Responsif -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan B32-L01: Katalog Produk Auto-Fit Grid</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      padding: 2rem;
    }
    /* Formula Ajaib: repeat(auto-fit, minmax(260px, 1fr)) */
    .katalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .kartu-produk {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
    }
    .kartu-produk img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .detail { padding: 1.25rem; }
    .detail h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
    .detail p { margin: 0; color: #64748b; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Katalog Karya Pameran (Auto-Fit Grid Responsif)</h1>
  <div class="katalog-grid">
    <div class="kartu-produk">
      <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400" alt="Buku">
      <div class="detail">
        <h3>Zine Tipografi Vol. 1</h3>
        <p>Rp85.000 &middot; Edisi Terbatas</p>
      </div>
    </div>
    <div class="kartu-produk">
      <img src="https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=400" alt="Poster">
      <div class="detail">
        <h3>Poster Aksara Kawi</h3>
        <p>Rp120.000 &middot; Cetak Sablon 4 Warna</p>
      </div>
    </div>
    <div class="kartu-produk">
      <img src="https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=400" alt="Kemasan">
      <div class="detail">
        <h3>Kemasan Teh Rempah</h3>
        <p>Rp65.000 &middot; Kertas Daur Ulang</p>
      </div>
    </div>
  </div>
</body>
</html>
