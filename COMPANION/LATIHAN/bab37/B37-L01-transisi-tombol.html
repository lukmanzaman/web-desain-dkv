<!-- B37-L01-transisi-tombol.html: Latihan Durasi & Timing Function Transisi -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan B37-L01: Dinamika Gerak Transisi</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 3rem; background: #0f172a; color: #fff; }
    .btn-smooth {
      padding: 0.8rem 1.5rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }
    .btn-smooth:hover {
      background: #4f46e5;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <h1>🛠️ Latihan B37-L01: Transisi Mikro</h1>
  <button class="btn-smooth">Uji Gerak Transisi</button>
</body>
</html>
