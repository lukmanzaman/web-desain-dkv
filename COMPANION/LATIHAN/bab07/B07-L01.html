<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan B07-L01: Menyusun Portofolio Karya Bergambar</title>
</head>
<body>
  <!-- B07-L01: Menyusun Portofolio Karya
       Tantangan Studio:
       1. Tambahkan tag <img> dengan atribut src, alt, width, dan height.
       2. Bungkus gambar ke dalam elemen <figure> lengkap dengan <figcaption>.
       3. Gunakan elemen <picture> untuk art direction layar ponsel vs desktop bila diperlukan.
  -->
  <header>
    <h1>Galeri Karya Seni Cetak</h1>
    <p>Eksplorasi teknik cukil kayu dan litografi kontemporer.</p>
  </header>

  <main>
    <article>
      <h2>Karya 01: Harmoni Pesisir</h2>
      
      <!-- Contoh implementasi <figure> dan <img> yang semantik -->
      <figure>
        <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800" 
             alt="Cetak seni grafis monokrom bermotif ombak laut dan perahu nelayan tradisional" 
             width="800" height="500">
        <figcaption><em>Harmoni Pesisir (2025)</em> &mdash; Teknik Cukil Kayu di atas Kertas Daluwang 250 gsm.</figcaption>
      </figure>
      
      <p>Karya ini mengeksplorasi ketegangan antara garis tegas cukilan dan kelembutan serat kertas alami.</p>
    </article>
  </main>
</body>
</html>
