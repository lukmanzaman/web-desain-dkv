  <!-- B12-L01: Berkas Latihan Audit Validasi
       Tantangan Studio:
       1. Temukan atribut yang salah penamaan atau nilai duplikat.
       2. Periksa gambar yang belum memiliki atribut alt.
       3. Periksa tag yang tidak ditutup dengan benar.
       4. Uji dokumen ini di https://validator.w3.org/nu/ hingga menghasilkan "No errors found".
  -->
  <header>
    <h1>Audit Validasi Dokumen Web</h1>
    <p>Uji ketangguhan sintaksis HTML Anda menggunakan W3C Nu HTML Checker.</p>
  </header>

  <main>
    <section>
      <h2>Daftar Cek Kelayakan:</h2>
      <ul>
        <li>Deklarasi DOCTYPE baku</li>
        <li>Atribut bahasa pada tag html</li>
        <li>Penutupan simetris seluruh tag</li>
        <li>Aksesibilitas gambar dan formulir</li>
      </ul>
    </section>
  </main>
